name: Codex Coverage Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: Codex Coverage Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-frontmatter
      
      - name: Start backend services
        run: |
          docker compose up -d backend
          # Wait for backend to be ready
          timeout 60 bash -c 'until curl -f http://127.0.0.1:8092/healthz 2>/dev/null; do sleep 2; done'
      
      - name: Run Codex audit
        id: audit
        run: |
          python scripts/codex_audit_missing.py --base-url http://127.0.0.1:8092
          
          # Extract metrics for summary
          echo "## Codex Coverage Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Parse JSON and add to summary
          python -c "
          import json
          with open('artifacts/codex-missing.json') as f:
              data = json.load(f)
          
          counts = data['counts']
          coverage = data['coverage']
          policy = data['policy']
          
          print(f\"**Coverage:** {counts['unique_refs']} refs across {counts['quests_scanned']} quests\")
          print(f\"**Avg Score:** {coverage['average_score']}/100\")
          print(f\"**Zero Coverage:** {coverage['quests_no_codex_refs']} quests ({coverage['quests_no_codex_refs']/counts['quests_scanned']*100:.1f}%)\")
          print(f\"**Invalid Refs:** {counts['invalid_unique_refs']}\")
          print(f\"**Missing Refs:** {counts['missing_unique_refs']}\")
          print(f\"**Policy Violations:** {policy['violations_count']}\")
          " >> $GITHUB_STEP_SUMMARY
      
      - name: Check for failures
        run: |
          # Parse audit results
          INVALID_REFS=$(python -c "import json; print(json.load(open('artifacts/codex-missing.json'))['counts']['invalid_unique_refs'])")
          POLICY_VIOLATIONS=$(python -c "import json; print(json.load(open('artifacts/codex-missing.json'))['policy']['violations_count'])")
          
          echo "Invalid refs: $INVALID_REFS"
          echo "Policy violations: $POLICY_VIOLATIONS"
          
          # Fail if there are invalid refs
          if [ "$INVALID_REFS" -gt 0 ]; then
            echo "❌ FAIL: $INVALID_REFS invalid Codex references found"
            exit 1
          fi
          
          # Fail if there are policy violations
          if [ "$POLICY_VIOLATIONS" -gt 0 ]; then
            echo "❌ FAIL: $POLICY_VIOLATIONS starter quest policy violations"
            exit 1
          fi
          
          echo "✅ PASS: No invalid refs or policy violations"
      
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-audit-report
          path: |
            artifacts/codex-missing.json
            artifacts/codex-missing.md
          retention-days: 30
      
      - name: Comment PR with summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('artifacts/codex-missing.json', 'utf8'));
            
            const counts = data.counts;
            const coverage = data.coverage;
            const policy = data.policy;
            const zeroCoveragePct = (coverage.quests_no_codex_refs / counts.quests_scanned * 100).toFixed(1);
            
            let body = `## 📊 Codex Coverage Audit\n\n`;
            body += `| Metric | Value |\n`;
            body += `|--------|-------|\n`;
            body += `| Coverage | ${counts.unique_refs} refs across ${counts.quests_scanned} quests |\n`;
            body += `| Avg Score | ${coverage.average_score}/100 |\n`;
            body += `| Zero Coverage | ${coverage.quests_no_codex_refs} (${zeroCoveragePct}%) |\n`;
            body += `| Invalid Refs | ${counts.invalid_unique_refs} ${counts.invalid_unique_refs > 0 ? '❌' : '✅'} |\n`;
            body += `| Missing Refs | ${counts.missing_unique_refs} ${counts.missing_unique_refs > 0 ? '⚠️' : '✅'} |\n`;
            body += `| Policy Violations | ${policy.violations_count} ${policy.violations_count > 0 ? '❌' : '✅'} |\n`;
            
            if (policy.violations_count > 0) {
              body += `\n### ❌ Policy Violations\n\n`;
              for (const [quest, violations] of Object.entries(policy.violations_by_quest)) {
                body += `**${quest}** (Starter):\n`;
                violations.forEach(v => body += `- ${v}\n`);
              }
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
      
      - name: Stop backend services
        if: always()
        run: docker compose down
