<!DOCTYPE html>
<html>
<head>
    <title>CMS Login</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #1e293b; padding: 2rem; border-radius: 8px; width: 300px; }
        input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; box-sizing: border-box; background: #334155; border: 1px solid #475569; color: white; }
        button { width: 100%; padding: 0.75rem; background: #38bdf8; border: none; color: #0f172a; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .error { color: #f87171; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>CMS Login</h2>
        {% if error %}
            <p class="error" data-testid="login-error">{{ error }}</p>
        {% endif %}
        <form action="/login" method="post">
            <label>Username</label>
            <input type="text" name="username" data-testid="login-username" required>
            <label>Password</label>
            <input type="password" name="password" data-testid="login-password" required>
            <button type="submit" data-testid="login-submit">Login</button>
        </form>
    </div>
</body>
</html>
