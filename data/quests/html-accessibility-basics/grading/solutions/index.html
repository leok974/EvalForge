<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Accessibility</title></head>
<body>
  <img data-testid="avatar" src="assets/avatar.png" alt="User avatar" />
  <button data-testid="close" aria-label="Close dialog">X</button>

  <form>
    <label for="name">Name</label>
    <input id="name" name="name" />
  </form>
</body>
</html>
