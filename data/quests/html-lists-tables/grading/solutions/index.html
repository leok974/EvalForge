<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lists & Tables</title>
</head>
<body>
  <ul data-testid="task-list">
    <li>Learn</li>
    <li>Build</li>
    <li>Ship</li>
  </ul>

  <table data-testid="scores">
    <thead>
      <tr><th>Name</th><th>Score</th></tr>
    </thead>
    <tbody>
      <tr><td>Alice</td><td>10</td></tr>
      <tr><td>Bob</td><td>8</td></tr>
    </tbody>
  </table>
</body>
</html>
