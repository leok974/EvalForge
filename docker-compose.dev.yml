version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: evalforge-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: evalforge_app
      POSTGRES_PASSWORD: evalforge_dev
      POSTGRES_DB: evalforge
    volumes:
      - evalforge_db_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalforge_app -d evalforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evalforge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  evalforge_db_dev:
